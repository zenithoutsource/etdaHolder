<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mDL NFC host tester</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: Segoe UI, system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #122; }
    main { max-width: 720px; margin: 32px auto; padding: 0 16px 48px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p, li { line-height: 1.45; }
    .panel { background: #fff; border-radius: 12px; padding: 16px 18px; margin-top: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    textarea { width: 100%; min-height: 92px; box-sizing: border-box; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    button { background: #12315a; color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    button.secondary { background: #e8edf3; color: #12315a; }
    video { width: 100%; max-height: 240px; background: #000; border-radius: 8px; margin-top: 8px; }
    .muted { color: #556; font-size: .92rem; }
    .ok { color: #0b6b32; }
    .err { color: #b42318; }
    dl { display: grid; grid-template-columns: 180px 1fr; gap: 6px 12px; }
    dt { font-weight: 600; }
    .banner { background: #fff7e6; border: 1px solid #f0d48a; padding: 10px 12px; border-radius: 8px; }
    details { margin-top: 12px; }
    summary { cursor: pointer; font-weight: 600; color: #12315a; }
  </style>
</head>
<body>
  <main>
    <h1>mDL NFC host</h1>

    <section class="panel">
      <p>
        <button type="button" id="present">Wait for tap</button>
      </p>
      <p id="status" class="muted">Idle.</p>

      <details id="lab">
        <summary>Lab: paste mdoc QR</summary>
        <label for="engagement">Device Engagement QR</label>
        <textarea id="engagement" placeholder="mdoc:..."></textarea>
        <p>
          <button type="button" id="scan" class="secondary">Scan with camera</button>
        </p>
        <video id="preview" hidden playsinline></video>
      </details>
    </section>

    <section class="panel" id="result" hidden>
      <h2>Received mDL claims</h2>
      <p id="verifyBanner" class="banner" hidden></p>
      <dl id="claims"></dl>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
